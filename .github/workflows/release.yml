name: Release and Deploy Frontend

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.1
        with:
          # Necessário para o Semantic Release ler o histórico de commits
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            app/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --recursive --frozen-lockfile

      - name: Semantic Release (Gera a Versão e o Changelog)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Isto é o que gera a tag, atualiza o package.json e cria o CHANGELOG.md!
        run: pnpm exec semantic-release

      - name: Build
        working-directory: ./app
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_API_VERSION: v1
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_BASE_PATH: /
        run: pnpm build

      - name: Deploy no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=interno-rotas --branch=main
          workingDirectory: ./app